site_name: ゆんのブログ
site_url: https://yun-cpp-v.github.io/yun-site/
site_dir: ../build/site

repo_url: https://github.com/yun-cpp-v/yun-site
repo_name: yun-cpp-v/yun-site

plugins:
  - search
  - awesome-pages

theme:
  name: material
  language: ja
  palette:
    primary: deep-purple
    accent: blue
  features:
    - navigation.tabs

markdown_extensions:
  - admonition
  - def_list
  - attr_list
  - footnotes
  - pymdownx.details
  - pymdownx.superfences
