site_name: ゆんのブログ
site_url: https://yun-cpp-v.github.io/blog/
site_dir: ../build/site

repo_url: https://github.com/yun-cpp-v/blog
repo_name: yun-cpp-v/blog

plugins:
  - search
  - awesome-pages
  - social

theme:
  # custom_dir: overrides
  name: material
  language: ja
  palette:
    primary: deep-purple
    accent: blue
  features:
    - navigation.tabs

markdown_extensions:

  # - meta
  - admonition
  - def_list
  - attr_list
  - footnotes
  - pymdownx.details
  - pymdownx.superfences
